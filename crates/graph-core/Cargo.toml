[package]
name = "graph-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compact directed graph indexing and queries for SiYuan"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leiden-rs = { version = "=0.8.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
